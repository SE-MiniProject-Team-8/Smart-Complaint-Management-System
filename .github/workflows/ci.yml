name: Application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest test_scms -v
      - run: node --check scms/static/app.js
      - run: node --test tests/browser_smoke.cjs
      - run: git diff --check
  browser:
    needs: application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix "$RUNNER_TEMP/scms-browser" playwright@1.64.1
      - run: '"$RUNNER_TEMP/scms-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: python tests/run_product_browser.py
        env:
          NODE_PATH: ${{ runner.temp }}/scms-browser/node_modules
