name: Application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Unit and integration tests with line and branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage report (fails below 90%)
        run: |
          python -m coverage report
          python -m coverage xml
          python -m coverage html
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
      - name: Design-stage model tests (test_scms.py does not import the application)
        run: python -m unittest test_scms -v
      - run: node --check scms/static/app.js
      - run: node --test tests/browser_smoke.cjs
      - run: git diff --check
  browser:
    needs: application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --prefix "$RUNNER_TEMP/scms-browser" playwright@1.64.1
      - run: '"$RUNNER_TEMP/scms-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: python tests/run_product_browser.py
        env:
          NODE_PATH: ${{ runner.temp }}/scms-browser/node_modules
